# FPT RAG — edge proxy (arch flow: nginx edge / perimeter).
# TLS termination, rate limiting, and SSO identity-header injection belong here,
# not inside the app. This is a working reference for the docker-compose stack;
# harden the commented sections before production.

worker_processes auto;
events { worker_connections 1024; }

http {
    # --- Rate limiting: 10 req/s per client IP, small burst. ---
    limit_req_zone $binary_remote_addr zone=raglimit:10m rate=10r/s;

    upstream rag_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- TLS (enable with mounted certs; also open 443 in compose) ---
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Match the API's default RAG_MAX_UPLOAD_BYTES (25 MiB).
        client_max_body_size 25m;

        # --- SSO identity injection ---------------------------------------
        # After the edge authenticates the user (SSO/OIDC), inject the trusted
        # identity headers the API reads (api/auth.py). Strip any client-supplied
        # values first so a caller cannot spoof them, then set the verified ones
        # and the shared secret (RAG_PROXY_SHARED_SECRET) the API validates.
        #
        #   proxy_set_header X-Tenant-Id     $sso_tenant;
        #   proxy_set_header X-User-Id       $sso_user;
        #   proxy_set_header X-Principals    $sso_groups;
        #   proxy_set_header X-Classification $sso_clearance;
        #   proxy_set_header X-Proxy-Secret  "<shared-secret>";
        # Strip EVERY identity/control header a client might send, so nothing is
        # trusted unless the edge re-injects it above after SSO.
        proxy_set_header X-Tenant-Id      "";
        proxy_set_header X-User-Id        "";
        proxy_set_header X-Principals     "";
        proxy_set_header X-Classification "";
        proxy_set_header X-Session-Id     "";
        proxy_set_header X-Language       "";
        proxy_set_header X-Proxy-Secret   "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- Streaming route: disable buffering so SSE tokens flush live. ---
        location /query/stream {
            proxy_pass http://rag_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }

        location / {
            limit_req zone=raglimit burst=20 nodelay;
            proxy_pass http://rag_api;
            proxy_read_timeout 120s;
        }
    }
}
